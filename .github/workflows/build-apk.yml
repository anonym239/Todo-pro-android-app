name: Build & Release TodoPro APK

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get version from tag
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Update versionName in build.gradle
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          VERSION_CLEAN="${VERSION#v}"
          sed -i "s/versionName \".*\"/versionName \"$VERSION_CLEAN\"/" app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          echo "Building version: $VERSION_CLEAN (code: ${{ github.run_number }})"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cp app/build/outputs/apk/debug/app-debug.apk TodoPro-${VERSION}.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoPro-APK-${{ steps.get_version.outputs.VERSION }}
          path: TodoPro-${{ steps.get_version.outputs.VERSION }}.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: "TodoPro ${{ steps.get_version.outputs.VERSION }}"
          files: TodoPro-${{ steps.get_version.outputs.VERSION }}.apk
          body: |
            ## 📱 TodoPro ${{ steps.get_version.outputs.VERSION }}

            ✅ Automatisch gebaut von GitHub Actions

            ### 📥 Installation:
            1. **APK herunterladen** (Datei unten)
            2. Auf Android-Handy übertragen
            3. Installieren (**Unbekannte Quellen** muss erlaubt sein)
            4. Beim ersten Start: Exakte Alarme erlauben

            ### 🔄 Auto-Update:
            Die App prüft beim Start automatisch ob eine neue Version verfügbar ist.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
