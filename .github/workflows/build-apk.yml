name: Build & Release TodoPro APK

on:
  push:
    branches: [ '**' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Fest auf 24.04: dort ist das Android-SDK vorinstalliert (ubuntu-latest wechselt gerade auf 26)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get version from tag
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Update versionName in build.gradle
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          VERSION_CLEAN="${VERSION#v}"
          sed -i "s/versionName \".*\"/versionName \"$VERSION_CLEAN\"/" app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          echo "Building version: $VERSION_CLEAN (code: ${{ github.run_number }})"

      - name: Signatur-Schluessel bereitstellen
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> $GITHUB_ENV
            echo "Fester Release-Schluessel wird verwendet."
          else
            echo "::warning::Keine Signatur-Secrets gefunden - APK wird mit Debug-Schluessel signiert."
          fi

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cp app/build/outputs/apk/release/app-release.apk TodoPro-${VERSION}.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoPro-APK-${{ steps.get_version.outputs.VERSION }}
          path: TodoPro-${{ steps.get_version.outputs.VERSION }}.apk

      - name: Create or Update GitHub Release
        # Nur auf main/master (oder bei einem manuellen Release) wird eine neue Version veroeffentlicht.
        # Andere Branches bauen nur zum Testen (APK unter "Artifacts").
        if: github.event_name == 'release' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: "TodoPro ${{ steps.get_version.outputs.VERSION }}"
          files: TodoPro-${{ steps.get_version.outputs.VERSION }}.apk
          body: |
            ## 📱 TodoPro ${{ steps.get_version.outputs.VERSION }}

            ✅ Automatisch gebaut von GitHub Actions

            ### 📥 Installation:
            1. **APK herunterladen** (Datei unten)
            2. Auf Android-Handy übertragen
            3. Installieren (**Unbekannte Quellen** muss erlaubt sein)
               Falls Play Protect warnt: **Details → Trotzdem installieren**
            4. Beim ersten Start: Exakte Alarme erlauben

            ### ✨ Neu in dieser Version:
            - Spracheingabe: Mikrofon-Knopf antippen und Aufgabe einfach sagen
            - Wiederholende Erinnerungen (täglich / wöchentlich), z.B. für Tabletten
            - Knöpfe direkt in der Benachrichtigung: "Erledigt" und "In 10 Min nochmal"
            - Rückgängig nach versehentlichem Abhaken
            - Einstellung "Große Schrift"
            - Liste teilen (z.B. per WhatsApp)
            - Überfällige Erinnerungen werden rot markiert, Zeiten als "Heute"/"Morgen"
            - Größere Knöpfe und weichere Animationen

            ### 🔄 Auto-Update:
            Die App prüft beim Start automatisch ob eine neue Version verfügbar ist.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
