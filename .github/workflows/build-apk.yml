name: Build TodoPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Manuell auslösbar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TodoPro v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## TodoPro APK
            
            ✅ Automatisch gebaut von GitHub Actions
            
            ### Installation:
            1. APK herunterladen
            2. Auf Android-Handy übertragen
            3. Installieren (Unbekannte Quellen erlauben)
            4. Beim ersten Start: Exakte Alarme erlauben
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
