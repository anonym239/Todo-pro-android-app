plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.todopro.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.todopro.app"
        minSdk 31
        targetSdk 35
        versionCode 19
        versionName "1.2.0"
    }

    // Fester Release-Schlüssel (kommt im GitHub-Workflow aus den Repo-Secrets).
    // Gleiche Signatur bei jedem Build = Updates funktionieren, weniger Play-Protect-Warnungen.
    def ksFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasReleaseKey = ksFile != null && new File(ksFile).exists()

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksFile)
                storeType "pkcs12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            // Ohne Secrets (z.B. lokal) mit Debug-Schlüssel, damit der Build trotzdem klappt
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'nl.dionsegijn:konfetti-xml:2.0.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
}
